<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 에듀테크 사례집 · 중1–공통수학2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --num:#2E63DE; --rel:#0C9B87; --geo:#CE3F86; --data:#DC7223;
  --ink:#151A2B; --ink-2:#4A5268; --ink-3:#7C859C; --ink-4:#A6AEC2;
  --line:#E3E8F1; --line-2:#EFF2F8;
  --paper:#FFFFFF; --bg:#F7F9FC; --bg-2:#EEF2F9;
  --sh-s:0 1px 2px rgba(21,26,43,.05),0 1px 3px rgba(21,26,43,.04);
  --sh-m:0 4px 14px rgba(21,26,43,.07),0 1px 3px rgba(21,26,43,.05);
  --sh-l:0 18px 48px rgba(21,26,43,.15),0 4px 12px rgba(21,26,43,.07);
  --sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,'D2Coding',monospace;
  --sidebar:288px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
a{color:var(--num)}
:focus-visible{outline:2.5px solid #2E63DE;outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D3DAE7;border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#BCC5D6;background-clip:content-box}

/* ══ shell ══ */
.app{display:flex;flex-direction:column;height:100dvh}
.top{flex:none;background:var(--paper);border-bottom:1px solid var(--line);z-index:50}
.top-in{padding:0 18px;height:60px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(140deg,#2E63DE,#0C9B87 50%,#CE3F86);display:grid;place-items:center;box-shadow:var(--sh-m)}
.brand h1{margin:0;font-size:15.5px;font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.brand p{margin:0;font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;background:var(--bg-2);padding:3px;border-radius:11px;margin-left:6px}
.tab{padding:6px 15px;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--ink-3);transition:.15s}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--sh-s)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:7px}
.stat{display:flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:99px;background:var(--bg-2)}
.stat b{font-family:var(--mono);font-size:13px;font-weight:600}
.stat span{font-size:11px;color:var(--ink-3);font-weight:650}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:650;letter-spacing:-.015em;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#C9D3E6;background:var(--bg)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#252B44}
.btn.live{background:#0C9B87;border-color:#0C9B87;color:#fff}
.btn.live:hover{background:#0A8878}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg-2);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;gap:4px}
.btn.danger{color:#C2333B;border-color:#F0D4D6}
.btn.danger:hover{background:#FDF2F3;border-color:#E8BFC2}
.btn:disabled{opacity:.45;cursor:not-allowed}

.main{flex:1;display:flex;min-height:0}

/* ══ sidebar ══ */
.side{width:var(--sidebar);flex:none;border-right:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;min-height:0}
.side-top{flex:none;padding:13px 14px 10px;border-bottom:1px solid var(--line-2)}
.search{position:relative}
.search input{width:100%;padding:8px 11px 8px 33px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:500}
.search input::placeholder{color:var(--ink-4)}
.search input:focus{outline:none;background:var(--paper);border-color:#2E63DE;box-shadow:0 0 0 3px rgba(46,99,222,.12)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-4)}
.fchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.fchip{padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:11px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;transition:.14s}
.fchip .d{width:6px;height:6px;border-radius:99px;background:currentColor}
.fchip:hover{border-color:#C9D3E6}
.fchip[aria-pressed="true"]{color:#fff;border-color:transparent}

.tree{flex:1;overflow-y:auto;padding:8px 8px 40px;overscroll-behavior:contain}
.gsec{margin-bottom:3px}
.ghead{width:100%;display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;text-align:left}
.ghead:hover{background:var(--bg)}
.ghead .cv{color:var(--ink-4);transition:transform .18s;flex:none}
.gsec.open .ghead .cv{transform:rotate(90deg)}
.ghead b{font-size:12.5px;font-weight:800;letter-spacing:-.03em;flex:1}
.ghead .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:600}
.glist{display:none;padding:2px 0 6px 6px}
.gsec.open .glist{display:block}

.usec{margin:1px 0}
.uhead{width:100%;display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;text-align:left}
.uhead:hover{background:var(--bg)}
.uhead .bar{width:3px;height:15px;border-radius:99px;flex:none}
.uhead .rn{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--ink-3);flex:none;width:16px}
.uhead .t{flex:1;font-size:12.5px;font-weight:700;letter-spacing:-.03em;line-height:1.35;min-width:0}
.uhead .cv{color:var(--ink-4);transition:transform .18s;flex:none}
.usec.open .uhead .cv{transform:rotate(90deg)}
.uhead .badge{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:99px;flex:none}
.ulist{display:none;padding:1px 0 5px 22px}
.usec.open .ulist{display:block}
.midlbl{font-size:10px;font-weight:800;color:var(--ink-4);letter-spacing:.03em;padding:6px 8px 3px}

.srow{width:100%;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;text-align:left;transition:.12s}
.srow:hover{background:var(--bg)}
.srow .t{flex:1;font-size:12.5px;font-weight:600;letter-spacing:-.025em;line-height:1.35;color:var(--ink-2);min-width:0}
.srow .c{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--ink-4);flex:none}
.srow .c.has{color:#fff;padding:1px 6px;border-radius:99px}
.srow[aria-current="true"]{background:var(--selbg)}
.srow[aria-current="true"] .t{color:var(--selc);font-weight:750}
.hidden{display:none!important}
.noresult{padding:26px 14px;text-align:center;font-size:12px;color:var(--ink-3);font-weight:600}

/* ══ content ══ */
.content{flex:1;overflow-y:auto;min-width:0;position:relative}
.wrap{max-width:840px;margin:0 auto;padding:26px 30px 90px}

.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;font-weight:650;color:var(--ink-3);margin-bottom:11px}
.crumb .sep{color:var(--ink-4)}
.crumb .ac{padding:2px 8px;border-radius:99px;font-weight:750}
h2.page{margin:0;font-size:29px;font-weight:800;letter-spacing:-.05em;line-height:1.22}
.subttl{margin:7px 0 0;font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:-.02em}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-s);margin-top:18px;overflow:hidden}
.panel > .ph{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel > .ph h3{margin:0;font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase}
.panel > .ph .n{font-family:var(--mono);font-size:10px;background:var(--bg-2);padding:1px 7px;border-radius:99px;color:var(--ink-2);font-weight:600}
.panel > .pb{padding:14px 16px}
.foldbtn{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.foldbtn:hover{color:var(--ink)}
.foldbtn svg{transition:transform .18s}
.panel.closed .pb{display:none}
.panel.closed .foldbtn svg{transform:rotate(-90deg)}

.std{display:flex;gap:9px;padding:8px 0}
.std:first-child{padding-top:0}
.std:last-child{padding-bottom:0}
.std .code{font-family:var(--mono);font-size:10px;font-weight:600;flex:none;margin-top:2px;padding:2px 7px;border-radius:6px;background:var(--ink);color:#fff}
.std p{margin:0;font-size:13.5px;line-height:1.62;color:var(--ink-2);font-weight:500;letter-spacing:-.02em}
.newbadge{font-size:10px;font-weight:750;color:#B4651A;background:#FDF3E7;border:1px solid #F6DDBE;padding:1px 7px;border-radius:99px;margin-left:7px;vertical-align:middle}

.terms{display:flex;gap:5px;flex-wrap:wrap}
.term{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
.term.sym{font-family:var(--mono);font-size:11px}
.linkrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.linkrow .lbl{font-size:11px;font-weight:750;color:var(--ink-3);margin-right:2px}
.jump{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;letter-spacing:-.02em;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--paper);transition:.14s}
.jump:hover{transform:translateY(-1px);box-shadow:var(--sh-s)}
.jump .sq{width:6px;height:6px;border-radius:2px;flex:none}
.jump .gr{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.nolink{font-size:11.5px;color:var(--ink-4);font-weight:600}

/* ══ cases ══ */
.casehead{display:flex;align-items:center;gap:10px;margin:30px 0 12px}
.casehead h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.04em}
.casehead .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:600;background:var(--bg-2);padding:2px 8px;border-radius:99px}
.casehead .sp{margin-left:auto}

.case{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-s);margin-bottom:14px;overflow:hidden}
.case > .ch{display:flex;align-items:flex-start;gap:11px;padding:15px 18px 13px;border-bottom:1px solid var(--line-2)}
.case .tool{font-size:11.5px;font-weight:800;letter-spacing:-.02em;color:#fff;padding:4px 10px;border-radius:8px;flex:none;margin-top:2px}
.case .hh{flex:1;min-width:0}
.case .hh h4{margin:0;font-size:17px;font-weight:750;letter-spacing:-.04em;line-height:1.35}
.case .who{margin:5px 0 0;font-size:11px;color:var(--ink-3);font-weight:600}
.case .who b{color:var(--ink-2);font-weight:750}
.case .acts{display:flex;gap:5px;flex:none}
.case .tags{display:flex;gap:4px;flex-wrap:wrap;padding:0 18px 12px}
.case .tg{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
.case .cb{padding:4px 18px 18px}

/* rendered blocks */
.rb{font-size:14.5px;line-height:1.75;letter-spacing:-.02em;color:var(--ink-2);font-weight:450}
.rb h5{margin:20px 0 8px;font-size:17px;font-weight:800;letter-spacing:-.04em;color:var(--ink);line-height:1.35}
.rb h6{margin:16px 0 6px;font-size:14px;font-weight:750;letter-spacing:-.03em;color:var(--ink)}
.rb > *:first-child{margin-top:6px}
.rb p{margin:0 0 10px;white-space:pre-wrap}
.rb ul{margin:0 0 12px;padding-left:20px}
.rb li{margin:0 0 4px}
.rb blockquote{margin:0 0 12px;padding:9px 14px;border-left:3px solid var(--qc);background:var(--bg);border-radius:0 8px 8px 0;font-weight:500;color:var(--ink-2)}
.rb hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.rb figure{margin:0 0 14px}
.rb figure img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}
.rb figure iframe{width:100%;border:1px solid var(--line);border-radius:10px;display:block;background:var(--bg)}
.rb figcaption{margin-top:6px;font-size:11.5px;color:var(--ink-3);font-weight:600;text-align:center}
.rb a{font-weight:600}

.empty{border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;background:var(--paper)}
.empty .em{font-size:24px;margin-bottom:8px;opacity:.5}
.empty p{margin:0;font-size:13.5px;color:var(--ink-2);font-weight:650;letter-spacing:-.02em}
.empty span{display:block;font-size:12px;color:var(--ink-3);font-weight:550;margin-top:5px}
.empty .btn{margin-top:14px}

/* ══ editor ══ */
.editor{background:var(--paper);border:2px solid #0C9B87;border-radius:14px;box-shadow:var(--sh-m);margin-bottom:16px;overflow:hidden}
.editor .eh{padding:13px 16px;background:#E9F7F4;border-bottom:1px solid #C6E9E2;display:flex;align-items:center;gap:8px}
.editor .eh b{font-size:12.5px;font-weight:800;letter-spacing:-.03em;color:#0A6E60}
.editor .eh .sp{margin-left:auto;font-size:11px;color:#0A8878;font-weight:650}
.eb{padding:16px}
.fl{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;margin:0 0 6px}
.fld{margin-bottom:13px}
.inp{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;letter-spacing:-.02em}
.inp:focus{outline:none;background:var(--paper);border-color:#0C9B87;box-shadow:0 0 0 3px rgba(12,155,135,.13)}
.inp.big{font-size:17px;font-weight:700;letter-spacing:-.035em}
.tagpick{display:flex;gap:5px;flex-wrap:wrap}
.tsel{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);transition:.14s}
.tsel[aria-pressed="true"]{background:#0C9B87;border-color:#0C9B87;color:#fff}

.blocks{border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:9px}
.blk{background:var(--paper);border:1px solid var(--line);border-radius:9px;margin-bottom:7px;overflow:hidden}
.blk:last-child{margin-bottom:0}
.blk .bh{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg);border-bottom:1px solid var(--line-2)}
.blk .bt{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase}
.blk .bctl{margin-left:auto;display:flex;gap:2px}
.ib{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);transition:.12s}
.ib:hover{background:var(--bg-2);color:var(--ink)}
.ib.del:hover{background:#FDF2F3;color:#C2333B}
.blk .bd{padding:8px 10px}
.ta{width:100%;border:none;background:transparent;resize:none;font-size:14px;line-height:1.65;letter-spacing:-.02em;font-weight:450;padding:2px 0;overflow:hidden}
.ta:focus{outline:none}
.ta.h2{font-size:17.5px;font-weight:800;letter-spacing:-.04em}
.ta.h3{font-size:15px;font-weight:750;letter-spacing:-.03em}
.ta.code{font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--bg);border-radius:7px;padding:8px;font-weight:400}
.blk .hintline{font-size:10.5px;color:var(--ink-4);font-weight:600;margin-top:5px}
.blk .prev{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.blk .prev img{width:100%;border-radius:8px;display:block;border:1px solid var(--line)}
.blk .prev iframe{width:100%;border:1px solid var(--line);border-radius:8px;display:block;background:var(--bg)}
.miniinp{padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:500;width:100%}
.miniinp:focus{outline:none;background:var(--paper);border-color:#0C9B87}
.row2{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap}
.row2 .miniinp{flex:1;min-width:120px}
.addbar{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.addb{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);transition:.14s;display:inline-flex;align-items:center;gap:4px}
.addb:hover{border-color:#0C9B87;color:#0A8878;background:#F2FBF9}
.efoot{display:flex;gap:7px;justify-content:flex-end;align-items:center;margin-top:15px;padding-top:14px;border-top:1px solid var(--line-2)}
.efoot .warn{margin-right:auto;font-size:11px;font-weight:650;color:#B4651A}

/* ══ map ══ */
.mapview{flex:1;overflow:auto;min-width:0;padding:22px 24px 60px}
.mapwrap{max-width:1500px;margin:0 auto}
.mapintro{margin:0 0 16px}
.mapintro h2{margin:0 0 5px;font-size:22px;font-weight:800;letter-spacing:-.045em}
.mapintro p{margin:0;font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:-.02em}
.map{position:relative;min-width:1240px;display:grid;grid-template-columns:104px repeat(5,minmax(198px,1fr));gap:0 14px;align-items:start}
#links{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
#links path{fill:none;stroke:#BCC6D9;stroke-width:1.6;opacity:.5;transition:opacity .2s,stroke-width .2s}
#links path.cross{stroke-dasharray:4 5}
#links path.on{stroke-width:2.6;opacity:1}
#links path.off{opacity:.1}
.ch2{position:relative;z-index:1;padding-bottom:12px}
.ch2 .stg{font-size:9.5px;font-weight:800;letter-spacing:.11em;color:var(--ink-4);text-transform:uppercase;margin-bottom:5px}
.ch2 .g{border-radius:10px;padding:8px 11px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--sh-s)}
.ch2 .g b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.035em}
.ch2 .g span{display:block;font-size:10px;color:var(--ink-3);margin-top:1px;font-weight:600}
.arow{grid-column:1/-1;height:1px;background:var(--line-2);position:relative;z-index:1;margin:0}
.alab{position:relative;z-index:1;padding:16px 8px 16px 0}
.alab .bar{width:4px;border-radius:99px;height:24px;margin-bottom:8px}
.alab b{font-size:13px;font-weight:800;letter-spacing:-.035em;line-height:1.3;display:block}
.alab span{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:4px;display:block}
.mcell{position:relative;z-index:1;padding:16px 0;display:flex;flex-direction:column;gap:8px;min-height:70px}
.mblank{border:1px dashed var(--line);border-radius:11px;padding:12px;text-align:center;font-size:11px;color:var(--ink-4);font-weight:600;background:rgba(255,255,255,.45)}
.unit{position:relative;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 11px 10px 14px;box-shadow:var(--sh-s);transition:transform .16s,box-shadow .16s,border-color .16s,opacity .16s;overflow:hidden}
.unit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.unit:hover{transform:translateY(-2px);box-shadow:var(--sh-m)}
.unit .rn{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--c)}

    const k=a+">"+b; if(set.has(k))return; set.add(k);
    out.push({from:a,to:b,cross:UMAP[a].area!==UMAP[b].area}); };
  UNITS.forEach(x=>{ x.next.forEach(t=>add(x.id,t)); x.prev.forEach(p=>add(p,x.id)); });
  return out;
})();
UNITS.forEach(x=>{
  x.prevAll = EDGES.filter(e=>e.to===x.id).map(e=>e.from);
  x.nextAll = EDGES.filter(e=>e.from===x.id).map(e=>e.to);
});

function fmtDate(ts){const d=new Date(ts);return isNaN(d)?"":d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");}

async function sha(s){
  try{
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("mathedu:"+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){ return "plain:"+s; }
}

/* ═══════════════ 저장 계층 ═══════════════
   SUMS  : { caseId: {id, subId, tool, title, tags, author, uid, updatedAt} }
   BODY  : { caseId: [block,...] }        (필요할 때만 불러옴)
   IDX   : { subId: [summary,...] }       (SUMS에서 만들어 냄)
   백엔드 두 가지: firebase / local(브라우저) — firebase 설정은 이 파일 맨 위 FIREBASE_CONFIG에 적어 둡니다.
   ═════════════════════════════════════════ */
let SUMS={}, BODY={}, IDX={};
let USER=null;                          // 로그인한 회원 { uid, loginId, name, school, level, grades, subjects, interested, used, role, status }
let PENDING=[];                         // 승인 대기 회원 (관리자용)
const IMG_LIMIT_STORAGE=3*1024*1024;    // Firebase Storage 보안 규칙과 맞춘 값 (3MB)
const IMG_LIMIT_INLINE=350*1024;        // Firestore 문서 안에 그대로 담을 때의 한도
const isApproved=()=>!!USER&&USER.status==="approved";
const isAdmin=()=>!!USER&&USER.role==="admin"&&USER.status==="approved";

const DB={
  mode:"local", label:"이 기기에만 저장", detail:"", fb:null,

  async init(){
    const cfg=FIREBASE_CONFIG;
    if(cfg&&cfg.projectId&&cfg.apiKey){
      try{ await this.initFirebase(cfg); return; }
      catch(e){ console.warn(e); toast("Firebase 연결에 실패해 이 기기 저장으로 돌아갑니다",true); }
    }
    this.mode="local"; this.label="이 기기에만 저장"; this.detail="브라우저 저장소를 씁니다. 다른 사람에게는 보이지 않습니다.";
  },

  async initFirebase(cfg){
    const [app,fs,auth]=await Promise.all([
      import(SDK+"firebase-app.js"),
      import(SDK+"firebase-firestore.js"),
      import(SDK+"firebase-auth.js")
    ]);
    const a=app.initializeApp(cfg);
    const db=fs.getFirestore(a);
    const au=auth.getAuth(a);
    let storage=null;
    if(cfg.storageBucket){
      try{ const st=await import(SDK+"firebase-storage.js"); storage={mod:st,inst:st.getStorage(a)}; }catch(e){}
    }
    this.fb={app:a,db,fs,auth,au,storage};
    this.mode="firebase"; this.label="Firebase 연결됨";
    this.detail=cfg.projectId+(storage?" · 사진 업로드 가능":" · 사진은 주소로 넣어 주세요");
  },

  /* 목록 ─ firebase는 실시간으로 계속 갱신 */
  async watchIndex(cb){
    if(this.mode==="firebase"){
      const {fs,db}=this.fb;
      fs.onSnapshot(fs.collection(db,"caseSummaries"),snap=>{
        SUMS={}; snap.forEach(d=>{const v=d.data(); SUMS[d.id]={...v,id:d.id};});
        rebuildIndex(); cb();
      },err=>{ console.warn(err); toast("사례 목록을 읽지 못했습니다. Firestore 규칙을 확인해 주세요.",true); });
      return;
    }
    const raw=(lsGet(LS_DATA)||{}).index;
    SUMS={};
    Object.keys(raw||{}).forEach(sid=>(raw[sid]||[]).forEach(s=>{SUMS[s.id]={...s,subId:sid};}));
    rebuildIndex(); cb();
  },

  /* 본문 ─ 소단원 단위로 필요할 때 */
  async loadBodies(subId){
    const ids=(IDX[subId]||[]).map(s=>s.id).filter(i=>!BODY[i]);
    if(!ids.length) return;
    if(this.mode==="firebase"){
      const {fs,db}=this.fb;
      const q=fs.query(fs.collection(db,"caseBodies"),fs.where("subId","==",subId));
      const snap=await fs.getDocs(q);
      snap.forEach(d=>{ try{ BODY[d.id]=JSON.parse(d.data().blocksJson||"[]"); }catch(e){ BODY[d.id]=[]; } });
      ids.forEach(i=>{ if(!BODY[i]) BODY[i]=[]; });
      return;
    }
    const bank=((lsGet(LS_DATA)||{}).bodies||{})[subId]||{};
    Object.keys(bank).forEach(cid=>{ BODY[cid]=bank[cid].blocks||bank[cid]||[]; });
    ids.forEach(i=>{ if(!BODY[i]) BODY[i]=[]; });
  },

  async saveCase(rec){
    const sum={id:rec.id,subId:rec.subId,tool:rec.tool,title:rec.title,tags:rec.tags,author:rec.author,uid:rec.uid,updatedAt:rec.updatedAt};
    if(this.mode==="firebase"){
      const {fs,db}=this.fb;
      await fs.setDoc(fs.doc(db,"caseSummaries",rec.id),sum);
      await fs.setDoc(fs.doc(db,"caseBodies",rec.id),{subId:rec.subId,updatedAt:rec.updatedAt,blocksJson:JSON.stringify(rec.blocks||[])});
      SUMS[rec.id]=sum; BODY[rec.id]=rec.blocks||[]; rebuildIndex();
      return true;
    }
    SUMS[rec.id]=sum; BODY[rec.id]=rec.blocks||[]; rebuildIndex();
    return await this._flush(rec.subId);
  },

  async deleteCase(subId,caseId){
    if(this.mode==="firebase"){
      const {fs,db}=this.fb;
      await fs.deleteDoc(fs.doc(db,"caseSummaries",caseId));
      await fs.deleteDoc(fs.doc(db,"caseBodies",caseId));
      delete SUMS[caseId]; delete BODY[caseId]; rebuildIndex();
      return true;
    }
    delete SUMS[caseId]; delete BODY[caseId]; rebuildIndex();
    return await this._flush(subId);
  },

  /* ── 계정 ───────────────────────────────────────── */
  idToEmail(id){ return String(id).trim().toLowerCase()+LOGIN_DOMAIN; },

  /* 로그인 상태가 바뀔 때마다 회원 정보를 함께 실어 알려 줍니다 */
  watchAuth(cb){
    if(this.mode!=="firebase"){
      const local=(lsGet(LS_DATA)||{}).localUser||null;
      cb(local); return;
    }
    const {auth,au}=this.fb;
    auth.onAuthStateChanged(au,async u=>{
      if(this._signup) return;              // 가입 절차가 끝난 뒤 직접 반영합니다
      if(!u){ cb(null); return; }
      try{ cb(await this.getUser(u.uid)); }
      catch(e){ console.warn(e); cb(null); }
    });
  },

  async getUser(uid){
    if(this.mode!=="firebase") return (lsGet(LS_DATA)||{}).localUser||null;
    const {fs,db}=this.fb;
    const d=await fs.getDoc(fs.doc(db,"users",uid));
    return d.exists()?{...d.data(),uid}:null;
  },

  async signUp(profile,password){
    if(this.mode!=="firebase"){
      const u={...profile,uid:"local",role:"admin",status:"approved",createdAt:Date.now()};
      const d=lsGet(LS_DATA)||{}; d.localUser=u; lsSet(LS_DATA,d);
      return u;
    }
    const {auth,au,fs,db}=this.fb;
    this._signup=true;                       // 가입 도중 auth 콜백이 끼어들지 않게
    try{
      /* 계정을 먼저 만듭니다. 로그인된 뒤라야 Firestore를 읽고 쓸 수 있습니다. */
      const cred=await auth.createUserWithEmailAndPassword(au,this.idToEmail(profile.loginId),password);
      const uid=cred.user.uid;

      /* 첫 가입자 판별: bootstrap 문서를 만들 수 있으면 이 사람이 처음입니다.
         이미 있으면 규칙이 막으므로, 판정 자체가 서버에서 이뤄집니다. */
      let first=false;
      try{
        await fs.setDoc(fs.doc(db,"appConfig","bootstrap"),{ownerUid:uid,createdAt:Date.now()});
        first=true;
      }catch(e){ first=false; }

      const u={...profile, uid,
        role: first?"admin":"member",
        status: first?"approved":"pending",
        createdAt: Date.now(), approvedAt: first?Date.now():null, approvedBy: first?"(최초 가입)":null };
      await fs.setDoc(fs.doc(db,"users",uid),u);
      return u;
    } finally { this._signup=false; }
  },

  async signIn(loginId,password){
    if(this.mode!=="firebase") return (lsGet(LS_DATA)||{}).localUser||null;
    const {auth,au}=this.fb;
    const cred=await auth.signInWithEmailAndPassword(au,this.idToEmail(loginId),password);
    return await this.getUser(cred.user.uid);
  },

  async signOut(){
    if(this.mode!=="firebase") return;
    const {auth,au}=this.fb;
    await auth.signOut(au);
  },

  async listUsers(){
    if(this.mode!=="firebase"){ const u=(lsGet(LS_DATA)||{}).localUser; return u?[u]:[]; }
    const {fs,db}=this.fb;
    const snap=await fs.getDocs(fs.collection(db,"users"));
    const out=[]; snap.forEach(d=>out.push({...d.data(),uid:d.id}));
    return out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  },

  async updateUser(uid,patch){
    if(this.mode!=="firebase"){
      const d=lsGet(LS_DATA)||{}; d.localUser={...(d.localUser||{}),...patch}; lsSet(LS_DATA,d); return true;
    }
    const {fs,db}=this.fb;
    await fs.updateDoc(fs.doc(db,"users",uid),patch);
    return true;
  },

  /* 비밀번호 변경 ─ 현재 비밀번호로 본인 확인을 거칩니다 */
  async changePassword(loginId,currentPw,newPw){
    if(this.mode!=="firebase") throw new Error("로컬 모드에서는 쓸 수 없습니다.");
    const {auth,au}=this.fb;
    const u=au.currentUser;
    if(!u) { const e=new Error("no user"); e.code="auth/user-not-found"; throw e; }
    const cred=auth.EmailAuthProvider.credential(this.idToEmail(loginId),currentPw);
    await auth.reauthenticateWithCredential(u,cred);
    await auth.updatePassword(u,newPw);
    return true;
  },

  /* 이름을 바꾸면 이미 쓴 사례의 작성자 표기도 함께 고칩니다 */
  async renameAuthor(uid,name){
    const mine=Object.values(SUMS).filter(s=>s.uid===uid);
    if(!mine.length) return 0;
    if(this.mode!=="firebase"){
      mine.forEach(s=>{ SUMS[s.id]={...s,author:name}; });
      rebuildIndex();
      const subs=[...new Set(mine.map(s=>s.subId))];
      for(const sid of subs) await this._flush(sid);
      return mine.length;
    }
    const {fs,db}=this.fb;
    for(const s of mine){
      try{ await fs.updateDoc(fs.doc(db,"caseSummaries",s.id),{author:name}); SUMS[s.id]={...s,author:name}; }
      catch(e){ console.warn(e); }
    }
    rebuildIndex();
    return mine.length;
  },

  /* 사진 ─ Firebase Storage가 있으면 올리고, 없으면 본문에 그대로 담음 */
  async uploadImage(dataUrl,caseId){
    if(this.mode!=="firebase"||!this.fb.storage) return null;
    const {mod,inst}=this.fb.storage;
    const r=mod.ref(inst,"case-images/"+caseId+"/"+uid()+".jpg");
    await mod.uploadString(r,dataUrl,"data_url");
    return await mod.getDownloadURL(r);
  },

  get canUpload(){ return this.mode==="firebase"&&!!this.fb.storage; },
  get isShared(){ return this.mode==="firebase"; },

  /* 내부 ─ local */
  async _flush(subId){
    const idxOut={}; Object.values(SUMS).forEach(s=>{(idxOut[s.subId]=idxOut[s.subId]||[]).push(s);});
    const bank={}; (IDX[subId]||[]).forEach(s=>{ bank[s.id]={...s,blocks:BODY[s.id]||[]}; });
    const d=lsGet(LS_DATA)||{}; d.index=idxOut; d.bodies=d.bodies||{}; d.bodies[subId]=bank;
    return lsSet(LS_DATA,d);
  }
};

function rebuildIndex(){
  IDX={};
  Object.values(SUMS).forEach(s=>{ if(!SUBMAP[s.subId])return; (IDX[s.subId]=IDX[s.subId]||[]).push(s); });
  Object.keys(IDX).forEach(k=>IDX[k].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)));
}

const unitCnt=u2=>u2.subs.reduce((a,s)=>a+cnt(s.id),0);

function subMatch(sb,un){
  if(S.areas.size&&!S.areas.has(un.area)) return false;
  const q=S.q.trim().toLowerCase(); if(!q) return true;
  const pool=[un.title,un.no,un.theme,GMAP[un.grade].label,AREAS[un.area].name,sb.t,sb.mid||"",
    ...un.terms,...sb.c,...sb.c.map(c=>STD[c]||""),
    ...(IDX[sb.id]||[]).flatMap(k=>[k.tool,k.title,(k.tags||[]).join(" ")])].join(" ").toLowerCase();
  return pool.includes(q);
}
const unitMatch=un=>un.subs.some(sb=>subMatch(sb,un));

function caseCard(sum,hex){
  const blocks=BODY[sum.id];

  const canEdit = isApproved() && (isAdmin()||mine);
  const c=el("div","case");
  const ch=el("div","ch");
  ch.innerHTML='<span class="tool" style="background:'+hex+'">'+esc(sum.tool)+'</span>'+
    '<span class="hh"><h4>'+esc(sum.title)+'</h4><p class="who"><b>'+esc(sum.author||"익명")+'</b> · '+fmtDate(sum.updatedAt)+
    (isApproved()&&!canEdit?' · <span style="color:var(--ink-4)">다른 선생님의 사례</span>':'')+'</p></span>';
  const acts=el("span","acts");
  if(canEdit){
    const e=el("button","btn sm","수정"); e.onclick=()=>startEditor(sum.subId||S.sub,sum.id);
    const d=el("button","btn sm danger","삭제"); d.onclick=()=>delCase(sum.subId||S.sub,sum.id);
    acts.appendChild(e); acts.appendChild(d);

  }

function renderBlocks(root,blocks){
  root.innerHTML="";
  blocks.forEach(b=>{
    if(b.type==="h2") root.appendChild(el("h5",null,esc(b.text||"")));
    else if(b.type==="h3") root.appendChild(el("h6",null,esc(b.text||"")));
    else if(b.type==="p") root.appendChild(el("p",null,linkify(b.text||"")));
    else if(b.type==="quote") root.appendChild(el("blockquote",null,linkify(b.text||"")));
    else if(b.type==="hr") root.appendChild(el("hr"));
    else if(b.type==="ul"){
      const u2=el("ul");
      (b.text||"").split("\n").filter(x=>x.trim()).forEach(x=>u2.appendChild(el("li",null,linkify(x.replace(/^[-•*]\s*/,"")))));
      if(u2.children.length) root.appendChild(u2);
    }
    else if(b.type==="img"&&b.src){
      const f=el("figure");
      f.innerHTML='<img src="'+esc(b.src)+'" alt="'+esc(b.cap||"사례 이미지")+'" loading="lazy">'+(b.cap?'<figcaption>'+esc(b.cap)+'</figcaption>':'');
      root.appendChild(f);
    }
    else if(b.type==="embed"&&(b.html||"").trim()){
      const f=el("figure"), ifr=el("iframe");
      ifr.setAttribute("sandbox","allow-scripts allow-same-origin allow-popups allow-forms allow-presentation");
      ifr.setAttribute("referrerpolicy","no-referrer");

      ifr.srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;height:100%;font-family:sans-serif}iframe,img,video{max-width:100%;border:0}*{box-sizing:border-box}</style>'+b.html;
      f.appendChild(ifr);
      if(b.cap) f.appendChild(el("figcaption",null,esc(b.cap)));

    }
  });
  if(!root.children.length) root.innerHTML='<p style="color:var(--ink-4)">내용이 비어 있습니다.</p>';

function startEditor(subId,caseId){

function syncEditor(){
  const E=S.editor; if(!E) return;

  E.title=root.querySelector('[data-f="title"]').value.trim();

function dataUrlBytes(du){ const i=du.indexOf(","); return Math.floor((du.length-i-1)*3/4); }
function compressToLimit(img,startMax,limit){
  let max=startMax;
  const qualities=[0.8,0.65,0.5,0.35,0.22];
  for(let pass=0; pass<4; pass++){
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");
    cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    for(const q of qualities){
      const data=cv.toDataURL("image/jpeg",q);
      if(dataUrlBytes(data)<=limit) return data;
    }
    max=Math.round(max*0.7);
  }
  return null;
}

  inp.onchange=()=>{
    const f=inp.files[0]; inp.value=""; if(!f) return;
    if(f.size>25*1024*1024) toast("파일이 커서 처리하는 데 시간이 걸릴 수 있어요…");
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=async ()=>{
        const limit=DB.canUpload?IMG_LIMIT_STORAGE:IMG_LIMIT_INLINE;
        const startMax=DB.canUpload?1400:1000;
        const data=compressToLimit(img,startMax,limit);
        if(!data){
          toast("사진이 너무 커서 "+(DB.canUpload?"5MB":"350KB")+" 안으로 줄이지 못했습니다. 더 작은 사진을 골라 주세요.",true);
          return;
        }
        syncEditor();
        let src=data;
        if(DB.canUpload){
          toast("사진을 올리는 중…");
          try{ src=await DB.uploadImage(data,S.editor.draftId); }
          catch(e){ console.warn(e); toast("사진 업로드에 실패해 사례 안에 담습니다",true); src=data; }
        }
        const b=S.editor.blocks.find(x=>x.id===blockId);
        if(b){ b.src=src; renderPage(); toast("사진을 넣었습니다 ("+Math.round(dataUrlBytes(data)/1024)+"KB)"); }
      };
      img.onerror=()=>toast("이미지를 읽지 못했습니다",true);
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}


/* ═══ 저장 · 삭제 ═══ */
async function saveCase(btn,warnEl){
  syncEditor();
  const E=S.editor;
  if(!E.tool){ toast("도구 이름을 적어 주세요",true); return; }
  if(!E.title){ toast("사례 제목을 적어 주세요",true); return; }
  const blocks=E.blocks.filter(b=>{
    if(b.type==="hr") return true;
    if(b.type==="img") return !!(b.src||"").trim();
    if(b.type==="embed") return !!(b.html||"").trim();
    return !!(b.text||"").trim();
  });
  const size=JSON.stringify(blocks).length;
  const cap=DB.mode==="firebase"?900000:4500000;
  if(size>cap){
    if(warnEl) warnEl.textContent="내용이 너무 큽니다. 사진을 줄이거나 주소로 넣어 주세요.";
    toast("저장 용량을 넘었습니다. 사진을 줄여 주세요.",true); return;
  }
  const rec={ id:E.draftId, subId:E.subId, tool:E.tool, title:E.title, tags:[...E.tags],
              author:(USER?USER.name:"익명"), uid:E.uid||(USER?USER.uid:null), updatedAt:Date.now(), blocks };
  const isEdit=!!E.caseId;
  if(btn){ btn.disabled=true; btn.textContent="저장 중…"; }
  try{
    const ok=await DB.saveCase(rec);
    S.editor=null;
    toast(ok?(isEdit?"사례를 수정했습니다":"사례를 저장했습니다")
            :"이 기기에만 저장되었습니다. 공유 저장소에 연결할 수 없습니다.",!ok);
  }catch(e){
    console.warn(e);
    if(btn){ btn.disabled=false; btn.textContent=isEdit?"수정 저장":"사례 저장"; }
    toast("저장하지 못했습니다. 연결과 Firestore 규칙을 확인해 주세요.",true); return;
  }
  refresh();
}
async function delCase(subId,caseId){
  if(!confirm("이 사례를 지울까요? 되돌릴 수 없습니다.")) return;
  try{ await DB.deleteCase(subId,caseId); toast("사례를 지웠습니다"); }
  catch(e){ console.warn(e); toast("삭제하지 못했습니다",true); return; }
  refresh();
}

        cell.appendChild(b);

function drawLinks(){
  const map=$("#map"), svg=$("#links"); if(!map||!svg) return;
  svg.innerHTML="";
  const mr=map.getBoundingClientRect(), W=map.scrollWidth, H=map.scrollHeight;
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const pos={};
  map.querySelectorAll(".unit").forEach(n=>{
    const r=n.getBoundingClientRect();
    pos[n.dataset.id]={x1:r.left-mr.left,x2:r.right-mr.left,y:r.top-mr.top+r.height/2,dim:n.classList.contains("dim")};
  });
  const sel=S.mapSel;
  EDGES.forEach(e=>{
    const a=pos[e.from],b=pos[e.to]; if(!a||!b) return;
    if(UMAP[e.from].grade===UMAP[e.to].grade) return;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    const x1=a.x2,y1=a.y,x2=b.x1,y2=b.y,dx=Math.max(26,(x2-x1)*0.5);
    p.setAttribute("d","M"+x1+" "+y1+" C"+(x1+dx)+" "+y1+","+(x2-dx)+" "+y2+","+x2+" "+y2);
    let cls=e.cross?"cross":"";
    const act=sel&&(e.from===sel||e.to===sel);
    if(sel) cls+=act?" on":" off"; else if(a.dim||b.dim) cls+=" off";
    p.setAttribute("class",cls.trim());
    if(act){
      const hue=e.from===sel?A(UMAP[e.to].area).hex:A(UMAP[e.from].area).hex;
      p.style.stroke=hue;
      const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",e.from===sel?x2:x1); c.setAttribute("cy",e.from===sel?y2:y1);
      c.setAttribute("r","3.4"); c.style.fill=hue;
      svg.appendChild(p); svg.appendChild(c); return;
    }
    svg.appendChild(p);
  });
}

function pickerGroup(groups,selected,onToggle){
  const wrap=el("div");
  groups.forEach(g=>{
    const row=el("div"); row.style.marginBottom="9px";
    row.appendChild(el("div","pickg",esc(g.g)));
    const box=el("div","tagpick");
    g.items.forEach(it=>{
      const b=el("button","tsel",esc(it));
      b.type="button";
      b.setAttribute("aria-pressed",selected.has(it)?"true":"false");
      b.onclick=()=>{ selected.has(it)?selected.delete(it):selected.add(it);
        b.setAttribute("aria-pressed",selected.has(it)?"true":"false"); if(onToggle)onToggle(); };
      box.appendChild(b);
    });
    row.appendChild(box); wrap.appendChild(row);
  });
  return wrap;
}
function pickerFlat(items,selected){
  const box=el("div","tagpick");
  items.forEach(it=>{
    const b=el("button","tsel",esc(it)); b.type="button";
    b.setAttribute("aria-pressed",selected.has(it)?"true":"false");
    b.onclick=()=>{ selected.has(it)?selected.delete(it):selected.add(it);
      b.setAttribute("aria-pressed",selected.has(it)?"true":"false"); };
    box.appendChild(b);
  });
  return box;
}

function authError(e,ctx){
  const c=(e&&e.code)||"";
  if(ctx==="pw"&&(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-mismatch")))
    return "현재 비밀번호가 맞지 않습니다.";
  if(c.includes("email-already-in-use")) return "이미 쓰이고 있는 아이디입니다.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "아이디 또는 비밀번호가 맞지 않습니다.";
  if(c.includes("weak-password")) return "비밀번호가 너무 짧습니다.";
  if(c.includes("invalid-email")) return "아이디에 쓸 수 없는 문자가 있습니다.";
  if(c.includes("too-many-requests")) return "시도가 많았습니다. 잠시 뒤 다시 해 주세요.";
  if(c.includes("requires-recent-login")) return "보안을 위해 다시 로그인한 뒤 시도해 주세요.";
  if(c.includes("operation-not-allowed")) return "Firebase 콘솔에서 이메일·비밀번호 로그인을 켜 주세요.";
  if(c.includes("permission-denied")) return "권한이 없습니다. Firestore 보안 규칙을 확인해 주세요.";
  console.warn(e);
  return "처리하지 못했습니다. 연결 상태를 확인해 주세요.";
}

      '<input class="inp" type="text" value="'+esc(USER.loginId)+'" readonly disabled>'+
      '<div class="hintline">아이디는 바꿀 수 없습니다.</div></div>'+

      '<div class="fld"><label class="fl" for="pfName">이름</label><input class="inp" type="text" id="pfName" value="'+esc(USER.name||"")+'"></div>'+
      '<div class="fld"><label class="fl" for="pfSchool">소속 학교</label><input class="inp" type="text" id="pfSchool" value="'+esc(USER.school||"")+'"></div>'+
    '</div>'+
    '<div class="fld"><label class="fl">학교급</label><div class="tagpick" id="pfLevel">'+
      '<button class="tsel" type="button" data-lv="middle" aria-pressed="'+(st.level==="middle")+'">중학교</button>'+
      '<button class="tsel" type="button" data-lv="high" aria-pressed="'+(st.level==="high")+'">고등학교</button>'+
    '</div></div>'+
    '<div class="fld" id="pfGradeWrap"'+(st.level==="middle"?"":" hidden")+'><label class="fl">담당 학년 <span class="opt">복수 선택</span></label><div id="pfGrades"></div></div>'+
    '<div class="fld" id="pfSubjWrap"'+(st.level==="high"?"":" hidden")+'><label class="fl">담당 과목 <span class="opt">복수 선택</span></label><div id="pfSubjects"></div></div>'+
    '<div class="fld"><label class="fl">관심 있는 에듀테크 <span class="opt">복수 선택</span></label><div id="pfInterested"></div></div>'+
    '<div class="fld"><label class="fl">사용해 본 에듀테크 <span class="opt">복수 선택</span></label><div id="pfUsed"></div></div>'+
    '<div class="err" id="pfErr"></div>'+
    '<div class="frow"><button class="btn ghost" id="pfCancel">닫기</button>'+
    '<button class="btn live" id="pfSave">정보 저장</button></div>'+

    '<div class="pwsec">'+
      '<div class="pwhead">비밀번호 변경</div>'+
      '<div class="fld"><label class="fl" for="pwCur">현재 비밀번호</label><input class="inp" type="password" id="pwCur" autocomplete="current-password"></div>'+
      '<div class="grid2">'+
        '<div class="fld"><label class="fl" for="pwNew">새 비밀번호</label><input class="inp" type="password" id="pwNew" autocomplete="new-password" placeholder="6자 이상"></div>'+
        '<div class="fld"><label class="fl" for="pwNew2">새 비밀번호 확인</label><input class="inp" type="password" id="pwNew2" autocomplete="new-password"></div>'+
      '</div>'+
      '<div class="err" id="pwErr"></div>'+
      '<div class="frow"><button class="btn" id="pwBtn">비밀번호 바꾸기</button></div>'+
    '</div>';

  box.querySelector("#pfGrades").appendChild(pickerFlat(MID_GRADES,st.grades));
  box.querySelector("#pfSubjects").appendChild(pickerGroup(HS_SUBJECTS,st.subjects));
  box.querySelector("#pfInterested").appendChild(pickerGroup(EDTECH,st.interested));
  box.querySelector("#pfUsed").appendChild(pickerGroup(EDTECH,st.used));

  box.querySelectorAll("#pfLevel .tsel").forEach(b=>{
    b.onclick=()=>{
      st.level=b.dataset.lv;
      box.querySelectorAll("#pfLevel .tsel").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
      box.querySelector("#pfGradeWrap").hidden = st.level!=="middle";
      box.querySelector("#pfSubjWrap").hidden  = st.level!=="high";
    };
  });

  const err=box.querySelector("#pfErr");
  box.querySelector("#pfCancel").onclick=closeAuth;
  box.querySelector("#pfSave").onclick=async ()=>{
    const name=box.querySelector("#pfName").value.trim();
    const school=box.querySelector("#pfSchool").value.trim();
    if(!name){ err.textContent="이름을 적어 주세요."; return; }
    if(!school){ err.textContent="소속 학교를 적어 주세요."; return; }
    if(st.level==="middle"&&!st.grades.size){ err.textContent="담당 학년을 하나 이상 골라 주세요."; return; }
    if(st.level==="high"&&!st.subjects.size){ err.textContent="담당 과목을 하나 이상 골라 주세요."; return; }
    const btn=box.querySelector("#pfSave"); btn.disabled=true; btn.textContent="저장 중…";
    const patch={ name, school, level:st.level,
      grades: st.level==="middle"?[...st.grades]:[],
      subjects: st.level==="high"?[...st.subjects]:[],
      interested:[...st.interested], used:[...st.used] };
    try{
      const renamed = name!==USER.name;
      await DB.updateUser(USER.uid,patch);
      Object.assign(USER,patch);
      lsSet(LS_ME,name);
      let n=0;
      if(renamed){ try{ n=await DB.renameAuthor(USER.uid,name); }catch(e){ console.warn(e); } }
      setAccountUI(); closeAuth();
      toast(n?("저장했습니다. 사례 "+n+"건의 작성자 이름도 함께 바꿨습니다."):"저장했습니다");
      refresh();
    }catch(e){
      btn.disabled=false; btn.textContent="정보 저장";
      err.textContent=authError(e);
    }
  };

  const pwErr=box.querySelector("#pwErr");
  box.querySelector("#pwBtn").onclick=async ()=>{
    const cur=box.querySelector("#pwCur").value;
    const a=box.querySelector("#pwNew").value, b=box.querySelector("#pwNew2").value;
    if(!cur){ pwErr.textContent="현재 비밀번호를 입력해 주세요."; return; }
    if(a.length<6){ pwErr.textContent="새 비밀번호는 6자 이상이어야 합니다."; return; }
    if(a!==b){ pwErr.textContent="새 비밀번호를 두 번 다르게 입력했습니다."; return; }
    if(a===cur){ pwErr.textContent="지금 쓰는 비밀번호와 다르게 정해 주세요."; return; }
    const btn=box.querySelector("#pwBtn"); btn.disabled=true; btn.textContent="확인 중…";
    try{
      await DB.changePassword(USER.loginId,cur,a);
      box.querySelector("#pwCur").value=""; box.querySelector("#pwNew").value=""; box.querySelector("#pwNew2").value="";
      pwErr.textContent=""; toast("비밀번호를 바꿨습니다");
    }catch(e){
      pwErr.textContent=authError(e,"pw");
    }
    btn.disabled=false; btn.textContent="비밀번호 바꾸기";
  };

  $("#authModal").classList.add("on");
  setTimeout(()=>box.querySelector("#pfName").focus(),60);
}

/* ── 회원 관리 (관리자) ── */
async function loadPending(){
  if(!isAdmin()){ PENDING=[]; return; }
  try{ PENDING=(await DB.listUsers()).filter(u=>u.status==="pending"); }
  catch(e){ PENDING=[]; }
  setAccountUI();
}
async function openMembers(){
  if(!isAdmin()) return;
  $("#membersModal").classList.add("on");
  const box=$("#membersBox");
  box.innerHTML='<h3>회원 관리</h3><p>불러오는 중…</p>';
  let list=[];
  try{ list=await DB.listUsers(); }
  catch(e){ box.innerHTML='<h3>회원 관리</h3><p>'+esc(authError(e))+'</p><div class="frow"><button class="btn ghost" id="mbClose">닫기</button></div>';
    box.querySelector("#mbClose").onclick=closeMembers; return; }
  renderMembers(list);
}
const closeMembers=()=>$("#membersModal").classList.remove("on");
function renderMembers(list){
  const box=$("#membersBox");
  const pend=list.filter(u=>u.status==="pending");
  const rest=list.filter(u=>u.status!=="pending");
  box.innerHTML='<h3>회원 관리</h3><p>가입 신청을 승인하면 그 선생님이 사례를 쓸 수 있습니다.</p>'+
    '<div id="mbPend"></div><div id="mbRest"></div>'+
    '<div class="frow"><button class="btn ghost" id="mbClose">닫기</button></div>';
  box.querySelector("#mbClose").onclick=closeMembers;

  const sec=(title,n)=>{ const h=el("div","mbsec"); h.innerHTML='<span>'+esc(title)+'</span><em>'+n+'</em>'; return h; };
  const pw=box.querySelector("#mbPend");
  pw.appendChild(sec("승인 대기",pend.length));
  if(!pend.length) pw.appendChild(el("div","nolink","기다리는 신청이 없습니다."));
  pend.forEach(u=>pw.appendChild(memberRow(u,list)));

  const rw=box.querySelector("#mbRest");
  rw.appendChild(sec("회원",rest.length));
  rest.forEach(u=>rw.appendChild(memberRow(u,list)));
}
function memberRow(u,list){
  const row=el("div","mbrow");
  const cases=Object.values(SUMS).filter(s=>s.uid===u.uid).length;
  const where=(u.level==="high"?(u.subjects||[]):(u.grades||[])).join(", ");
  row.innerHTML =
    '<div class="mbmain">'+
      '<div class="mbname">'+esc(u.name)+
        (u.role==="admin"?'<span class="rolebadge admin">관리자</span>':'')+
        (u.status==="pending"?'<span class="rolebadge wait">대기</span>':'')+
        (u.status==="rejected"?'<span class="rolebadge no">거절됨</span>':'')+
      '</div>'+
      '<div class="mbsub">'+esc(u.loginId)+' · '+esc(u.school||"소속 미입력")+' · '+
        (u.level==="high"?"고":"중")+(where?' '+esc(where):'')+' · 사례 '+cases+'건</div>'+
      (u.used&&u.used.length?'<div class="mbtags">사용해 봄: '+u.used.map(t=>'<span>'+esc(t)+'</span>').join("")+'</div>':'')+
      (u.interested&&u.interested.length?'<div class="mbtags">관심: '+u.interested.map(t=>'<span>'+esc(t)+'</span>').join("")+'</div>':'')+
    '</div>';
  const acts=el("div","mbacts");
  const me=USER&&u.uid===USER.uid;
  const act=async (patch,msg)=>{
    try{ await DB.updateUser(u.uid,patch); Object.assign(u,patch); toast(msg);
      await loadPending(); renderMembers(await DB.listUsers()); refresh(); }
    catch(e){ toast(authError(e),true); }
  };
  if(u.status==="pending"){
    const ok=el("button","btn sm live","승인");
    ok.onclick=()=>act({status:"approved",approvedAt:Date.now(),approvedBy:USER.name},"승인했습니다");
    const no=el("button","btn sm danger","거절");
    no.onclick=()=>{ if(confirm(u.name+" 선생님의 신청을 거절할까요?")) act({status:"rejected"},"거절했습니다"); };
    acts.appendChild(ok); acts.appendChild(no);
  }else if(!me){
    if(u.role==="admin"){
      const b=el("button","btn sm","관리자 해제");
      b.onclick=()=>act({role:"member"},"관리자를 해제했습니다");
      acts.appendChild(b);
    }else{
      const b=el("button","btn sm","관리자로");
      b.onclick=()=>{ if(confirm(u.name+" 선생님을 관리자로 올릴까요? 모든 사례를 고치고 회원을 승인할 수 있게 됩니다.")) act({role:"admin"},"관리자로 올렸습니다"); };
      acts.appendChild(b);
    }
    if(u.status==="approved"){
      const b=el("button","btn sm danger","이용 정지");
      b.onclick=()=>{ if(confirm(u.name+" 선생님의 작성 권한을 막을까요? 사례는 남습니다.")) act({status:"rejected"},"작성 권한을 막았습니다"); };
      acts.appendChild(b);
    }else if(u.status==="rejected"){
      const b=el("button","btn sm live","다시 승인");
      b.onclick=()=>act({status:"approved",approvedAt:Date.now(),approvedBy:USER.name},"다시 승인했습니다");
      acts.appendChild(b);
    }
  }else{
    acts.appendChild(el("span","mbme","나"));
  }
  row.appendChild(acts);
  return row;
}

function download(text,type,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

});
$("#map").addEventListener("click",e=>{ if(e.target===e.currentTarget&&S.mapSel){S.mapSel=null;renderMap();} });
let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.view==="map")renderMap();},150);});
window.addEventListener("beforeunload",e=>{ if(S.editor){e.preventDefault();e.returnValue="";} });

/* ═══ 시작 ═══ */
(async function boot(){
  renderChips(); renderTree(); renderPage(); stats();
  setAccountUI();
  await DB.init();

  DB.watchAuth(async u=>{
    USER=u||null;
    if(USER) lsSet(LS_ME,USER.name);
    await loadPending();
    setAccountUI();
    if(!S.editor) renderPage();
  });

  let first=true;
  await DB.watchIndex(async ()=>{
    stats(); renderTree();
    if(S.view==="map") renderMap();
    if(first||!S.editor){
      renderPage();
      if(S.sub){ try{ await DB.loadBodies(S.sub); renderPage(); }catch(e){} }
    }
    first=false;
  });
})();
</script>
</body>
</html>
